<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaction requests · BreakTest</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="request-detail-page">
  <main class="request-detail-main">
    <section class="request-detail-panel" aria-labelledby="transaction-details-title">
      <div class="request-detail-heading">
        <div>
          <p class="request-detail-eyebrow">Transaction requests</p>
          <h1 id="transaction-details-title">Loading transaction…</h1>
          <p id="transaction-details-summary"></p>
        </div>
      </div>
      <div class="waterfall-legend" aria-label="Waterfall phases">
        <span><i class="phase-connection"></i>Connection / sending</span>
        <span><i class="phase-wait"></i>Waiting</span>
        <span><i class="phase-receive"></i>Receiving</span>
        <span id="timing-unknown-legend" title="The browser supplied a duration but no timing breakdown." hidden><i class="phase-unknown"></i>No timing breakdown</span>
      </div>
      <div class="request-detail-table-wrap">
        <table class="request-detail-table">
          <thead>
            <tr>
              <th scope="col">HTTP</th>
              <th scope="col">Method</th>
              <th scope="col">URL &amp; waterfall</th>
              <th scope="col" title="Recorded response size in kilobytes (1 KB = 1,000 bytes)">Size (KB)</th>
              <th scope="col" title="Response time">Time</th>
            </tr>
          </thead>
          <tbody id="transaction-details-requests"></tbody>
        </table>
        <p id="transaction-details-empty" class="request-detail-empty">No completed requests in this transaction yet.</p>
      </div>
    </section>
  </main>
  <script type="module" src="transaction-details.js"></script>
</body>
</html>
