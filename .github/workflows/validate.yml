name: Validate and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate extension sources
        run: python scripts/validate_extensions.py
      - name: Run Mozilla add-on validator
        run: npx --yes web-ext@10.5.0 lint --source-dir firefox --warnings-as-errors
      - name: Build deterministic store packages
        run: python scripts/package_extensions.py
      - name: Upload store packages
        uses: actions/upload-artifact@v6
        with:
          name: breaktest-browser-recorder-store-packages
          path: dist/
          if-no-files-found: error
