<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title description">
  <title id="title">BreakTest HAR Recorder promotional tile</title>
  <desc id="description">BreakTest logo with the words HAR Recorder and For JMX test plans.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04172d"/>
      <stop offset="0.58" stop-color="#082440"/>
      <stop offset="1" stop-color="#0d3154"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(121 140) rotate(90) scale(116)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d78ad" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#1d78ad" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020b16" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="440" height="280" fill="url(#background)"/>
  <rect width="260" height="280" fill="url(#glow)"/>

  <!-- Subtle request-flow motif. -->
  <g fill="none" stroke="#55a8d7" stroke-width="1.5" opacity="0.18">
    <path d="M300 30h68l18 18h54"/>
    <path d="M318 250h34l18-18h70"/>
    <path d="M0 225h48l18-18h45"/>
  </g>
  <g fill="#e8b84a" opacity="0.38">
    <circle cx="300" cy="30" r="3"/>
    <circle cx="386" cy="48" r="3"/>
    <circle cx="318" cy="250" r="3"/>
    <circle cx="370" cy="232" r="3"/>
    <circle cx="66" cy="207" r="3"/>
  </g>

  <!-- The established BreakTest icon is used unchanged. -->
  <g filter="url(#shadow)">
    <rect x="28" y="64" width="152" height="152" rx="24" fill="#061a31" stroke="#1b4768" stroke-width="2"/>
    <image x="40" y="76" width="128" height="128" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>
  </g>

  <rect x="192" y="62" width="3" height="156" rx="1.5" fill="#e6b746"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="216" y="91" fill="#e6b746" font-size="13" font-weight="700" letter-spacing="2.2">BREAKTEST</text>
    <text x="214" y="139" fill="#ffffff" font-size="32" font-weight="700" letter-spacing="-0.8">HAR Recorder</text>
    <text x="216" y="174" fill="#c9d8e5" font-size="19" font-weight="400">For JMX test plans</text>
  </g>

  <g transform="translate(216 197)">
    <rect width="166" height="1.5" rx="0.75" fill="#39739c" opacity="0.7"/>
    <circle cx="0" cy="0.75" r="3.5" fill="#e6b746"/>
    <circle cx="166" cy="0.75" r="3.5" fill="#2e94c8"/>
  </g>
</svg>
